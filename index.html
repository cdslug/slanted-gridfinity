<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Everything loads from this folder. The hashes cover the two inline
       scripts below (theme bootstrap, import map); update them if either changes. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-sWfR+bLnmVK0tj7CxILhaAQSRgcBEt03i5P6Q98AukQ=' 'sha256-Anj8s0t99oQITwKrN/SJSdLV6721iOb3F61VC2+UkTc='; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Slanted Gridfinity Bin Generator</title>
  <script>
    // Apply the saved theme before first paint; light is the default.
    try {
      document.documentElement.dataset.theme =
        localStorage.getItem('slanted-gridfinity.theme') === 'dark' ? 'dark' : 'light';
    } catch {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <div class="app">

    <!-- ================= Sidebar ================= -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <h1>Slanted Gridfinity</h1>
          <div class="subtitle">Diagonal bin generator for constrained drawers</div>
        </div>
        <button class="btn btn-sm theme-toggle" id="theme-toggle" type="button">Dark</button>
      </div>

      <div class="sidebar-body">

        <!-- Mounting -->
        <div class="control-section">
          <h3>Mounting</h3>
          <div class="param-row">
            <div class="param-text">
              <label id="orientation-label" data-help="mount.orientation" data-help-click>Orientation</label>
              <div class="value-display" id="orientation-val"></div>
            </div>
            <div class="radio-group param-radios" role="radiogroup" aria-labelledby="orientation-label">
              <label><input type="radio" name="orientation" value="horizontal" checked> Horizontal</label>
              <label><input type="radio" name="orientation" value="vertical"> Vertical</label>
            </div>
          </div>
          <div class="param-row" id="wall-system-row">
            <div class="param-text">
              <label for="wall-system" data-help="mount.system" data-help-click>Wall system</label>
              <div class="value-display" id="wall-system-val"></div>
            </div>
            <select id="wall-system">
              <option value="gridfinity">Gridfinity plate</option>
              <option value="opengrid" selected>openGrid</option>
              <option value="multiboard">Multiboard</option>
              <option value="skadis">SKÅDIS</option>
              <option value="hsw">HSW</option>
              <option value="goews">GOEWS</option>
              <option value="cleat">French cleat</option>
            </select>
          </div>
          <div class="param-row" id="mount-method-row">
            <div class="param-text">
              <label for="mount-method" data-help="mount.method" data-help-click>Attachment</label>
              <div class="value-display" id="mount-method-val"></div>
            </div>
            <!-- Options come from the wall system's methods (wall-mounts.js) -->
            <select id="mount-method"></select>
          </div>
        </div>

        <!-- Grid Size -->
        <div class="control-section">
          <h3>Grid Size</h3>
          <div class="param-row" id="grid-unit-row">
            <div class="param-text">
              <label for="grid-unit-mm" data-help="grid.unit" data-help-click>Unit size</label>
              <div class="value-display" id="grid-unit-note">mm per grid unit</div>
            </div>
            <input type="number" id="grid-unit-mm" min="20" max="100" step="0.5" value="42">
            <!-- Shown instead of the input when the wall system sets the spacing -->
            <div class="param-fixed" id="grid-unit-fixed"></div>
          </div>
          <div class="param-row">
            <div class="param-text">
              <label for="grid-divisions" data-help="grid.divisions" data-help-click>Divisions</label>
              <div class="value-display" id="grid-unit-val"></div>
            </div>
            <select id="grid-divisions">
              <option value="1" selected>Whole</option>
              <option value="2">Half</option>
            </select>
          </div>
          <div class="param-row">
            <div class="param-text">
              <label for="size-unit" data-help="grid.sizeUnit" data-help-click>Size in</label>
              <div class="value-display" id="size-unit-val"></div>
            </div>
            <select id="size-unit">
              <option value="units" selected>Grid units</option>
              <option value="mm">mm</option>
              <option value="cm">cm</option>
              <option value="in">in</option>
            </select>
          </div>
          <div class="param-row param-row-wide">
            <div class="param-text">
              <label for="grid-x" data-help="grid.size" data-help-click>Bin size</label>
              <div class="value-display" id="grid-size-val">X × Y units</div>
            </div>
            <div class="param-pair">
              <input type="number" id="grid-x" min="1" max="20" step="1" value="2" aria-label="X size">
              <span class="param-sep">×</span>
              <input type="number" id="grid-y" min="1" max="20" step="1" value="2" aria-label="Y size">
            </div>
          </div>
        </div>

        <!-- Height -->
        <div class="control-section">
          <h3>Height</h3>
          <div class="param-row">
            <div class="param-text">
              <label for="height-units" data-help="height.units" data-help-click>Height units</label>
              <div class="value-display" id="height-units-val"></div>
              <div class="value-display" id="diagonal-val"></div>
            </div>
            <input type="number" id="height-units" min="1" max="100" step="1" value="12">
          </div>
        </div>

        <!-- Slant / Offset -->
        <div class="control-section">
          <h3>Slant</h3>
          <div class="param-row">
            <div class="param-text">
              <label id="offset-mode-label" data-help="offset.mode" data-help-click>Set by</label>
              <div class="value-display" id="offset-mode-val"></div>
            </div>
            <div class="radio-group param-radios" role="radiogroup" aria-labelledby="offset-mode-label">
              <label><input type="radio" name="offset-mode" value="grid" checked> Grid</label>
              <label><input type="radio" name="offset-mode" value="angle"> Angle</label>
            </div>
          </div>
          <div class="param-row" id="offset-units-row">
            <div class="param-text">
              <label for="offset-units" data-help="offset.units" data-help-click>Offset</label>
              <div class="value-display" id="offset-units-val"></div>
            </div>
            <input type="number" id="offset-units" min="0" max="20" step="0.5" value="2">
          </div>
          <div class="param-row" id="offset-angle-row">
            <div class="param-text">
              <label for="offset-angle" data-help="offset.angle" data-help-click>Angle</label>
              <div class="value-display" id="offset-angle-val"></div>
            </div>
            <input type="number" id="offset-angle" min="0" max="90" step="0.5" value="30">
          </div>
          <div class="param-row" id="offset-axis-row">
            <div class="param-text">
              <label id="offset-axis-label" data-help="offset.axis" data-help-click>Offset axis</label>
              <div class="value-display">direction of slant</div>
            </div>
            <div class="radio-group param-radios" role="radiogroup" aria-labelledby="offset-axis-label">
              <label><input type="radio" name="offset-axis" value="x" checked> X</label>
              <label><input type="radio" name="offset-axis" value="y"> Y</label>
            </div>
          </div>
        </div>

        <!-- Walls -->
        <div class="control-section">
          <h3>Walls</h3>
          <div class="control-group">
            <label for="wall-thickness" data-help="walls.thickness" data-help-click>Wall thickness (mm)</label>
            <input type="range" id="wall-thickness" min="0.40" max="2.00" step="0.01" value="0.82">
            <div class="value-display" id="wall-thickness-val"></div>
          </div>
        </div>

        <!-- Print fit -->
        <div class="control-section">
          <h3>Print Fit</h3>
          <div class="param-row">
            <div class="param-text">
              <label for="nozzle" data-help="fit.nozzle" data-help-click>Nozzle</label>
              <div class="value-display">suggests a clearance</div>
            </div>
            <select id="nozzle">
              <option value="0.2">0.2 mm</option>
              <option value="0.4" selected>0.4 mm</option>
              <option value="0.6">0.6 mm</option>
              <option value="0.8">0.8 mm</option>
            </select>
          </div>
          <div class="param-row">
            <div class="param-text">
              <label for="fit-clearance" data-help="fit.clearance" data-help-click>Fit clearance</label>
              <div class="value-display" id="fit-clearance-val"></div>
            </div>
            <input type="number" id="fit-clearance" min="-0.2" max="0.6" step="0.05" value="0">
          </div>
        </div>

        <!-- Base -->
        <div class="control-section" id="base-section">
          <h3>Base</h3>
          <div class="checkbox-group">
            <input type="checkbox" id="include-base" checked>
            <label for="include-base" data-help="base.include">Include gridfinity base profile</label>
          </div>
        </div>

        <!-- End Bin -->
        <div class="control-section" id="end-bin-section">
          <h3>End Bin</h3>
          <div id="end-bin-controls">
            <div class="input-row">
              <div class="control-group">
                <label for="end-grid-x" data-help="end.size" data-help-click>X units</label>
                <input type="number" id="end-grid-x" min="1" max="20" step="1" value="2">
              </div>
              <div class="control-group">
                <label for="end-grid-y" data-help="end.size" data-help-click>Y units</label>
                <input type="number" id="end-grid-y" min="1" max="20" step="1" value="2">
              </div>
            </div>
            <div class="value-display" id="end-bin-info"></div>
          </div>
        </div>

        <a class="source-link source-link-body" href="https://github.com/cdslug/slanted-gridfinity" target="_blank" rel="noopener">github.com/cdslug/slanted-gridfinity</a>

      </div>

      <div class="sidebar-footer">
        <h3>Downloads</h3>
        <div class="checkbox-group">
          <input type="checkbox" id="download-bin" checked>
          <label for="download-bin" data-help="download.bin">Slanted bin</label>
        </div>
        <div class="checkbox-group" id="download-end-bin-row">
          <input type="checkbox" id="download-end-bin" checked>
          <label for="download-end-bin" data-help="download.endBin">End bin (support wedge)</label>
        </div>
        <div class="checkbox-group" id="download-part-row">
          <input type="checkbox" id="download-part" checked>
          <label for="download-part" id="download-part-label" data-help="download.part">Mount part</label>
        </div>
        <button class="btn btn-primary btn-full" id="export-stl">Export STL</button>
        <a class="source-link" href="https://github.com/cdslug/slanted-gridfinity" target="_blank" rel="noopener">github.com/cdslug/slanted-gridfinity</a>
      </div>
    </aside>

    <!-- ================= Viewport ================= -->
    <main class="viewport">
      <canvas id="three-canvas"></canvas>

      <!-- Model visibility (click) / opacity (drag) chips -->
      <div class="model-toggles" id="model-toggles"></div>

      <!-- Dimensions overlay -->
      <div class="info-overlay" id="info-overlay">
        <h4><button class="info-toggle" id="dim-toggle" type="button" aria-expanded="false">Dimensions<span class="info-caret" aria-hidden="true">▾</span></button></h4>
        <div id="dim-info"></div>
      </div>
    </main>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
